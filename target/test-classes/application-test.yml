spring:
  datasource.url: jdbc:h2:mem:activation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  datasource.driver-class-name: org.h2.Driver
  datasource.username: sa
  datasource.password:
  jpa.hibernate.ddl-auto: create-drop
  flyway.enabled: false
provider.base-url: http://localhost:9999
provider.connect-timeout: 100ms
provider.read-timeout: 100ms
security.jwt.secret: test-secret-key-that-is-at-least-32-bytes-long
security.jwt.issuer: https://identity.example.com
security.jwt.audience: activation-service
